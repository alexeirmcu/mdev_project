openapi: 3.0.3
info:
  title: Smart Trip Planner API
  description: REST API for generating, managing, and real-time replanning of family itineraries optimized by blocks using Google OR-Tools.
  version: 2.0.0
servers:
  - url: https://api.smart-tripplanner.com/v2
    description: Production server
paths:
  /trips:
    get:
      summary: List saved trips
      description: Returns a summarized list of all planned trips with optional filters by destination and date range.
      operationId: listTrips
      parameters:
        - name: cityCode
          in: query
          required: false
          description: Filter by the unique city identifier (e.g. madrid-es).
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: Filter trips starting from this date (ISO 8601 YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Filter trips ending on or before this date (ISO 8601 YYYY-MM-DD).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of trips retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSummaryResponse'
        '422':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationResult'

    post:
      summary: Generate a new trip itinerary
      description: Takes family preferences, base hotel, and desired places to calculate an optimal day distribution using Google OR-Tools.
      operationId: generateTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripGenerationRequest'
      responses:
        '200':
          description: Itinerary generated and saved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPlanResponse'
        '422':
          description: Invalid input data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationResult'

  /trips/{tripId}:
    get:
      summary: Get trip details
      description: Returns the full structured itinerary by days and blocks, along with the activity checklist status.
      operationId: getTripDetails
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPlanResponse'
        '422':
          description: Trip not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationResult'

  /trips/{tripId}/places/{placeId}/complete:
    patch:
      summary: Mark a destination as completed
      description: Atomically updates the completion status of a specific activity within the trip itinerary.
      operationId: completePlace
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: placeId
          in: path
          required: true
          schema:
            type: string
          example: "pl-museo-del-prado"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isCompleted
              properties:
                isCompleted:
                  type: boolean
                  example: true
      responses:
        '204':
          description: Place completion status updated successfully. No response body.
        '422':
          description: Trip or place not found in the itinerary.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationResult'

  /trips/{tripId}/replan:
    post:
      summary: Replan the remainder of the day
      description: Low-latency endpoint that instantly recalculates the remaining blocks of the current day based on completed items, current location, and sudden weather changes.
      operationId: replanTrip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripReplanRequest'
      responses:
        '200':
          description: Remaining itinerary recalculated and adapted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPlanResponse'
        '422':
          description: Trip not found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationResult'

  /trips/places/search:
    post:
      summary: Search points of interest (Must-sees)
      description: Retrieves a list of places filtered by city following a cascade search algorithm (local database → Foursquare external API).
      operationId: searchPlaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceSearchRequest'
      responses:
        '200':
          description: List of places retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceResponse'
        '422':
          description: Validation error or external service failure.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidationResult'

components:
  schemas:
    TripSummaryResponse:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
          example: "b5a9c123-4321-9876-fedc-ba9876543210"
        cityId:
          type: string
          example: "madrid-es"
        cityName:
          type: string
          example: "Madrid, España"
        startDate:
          type: string
          format: date
          example: "2026-06-15"
        endDate:
          type: string
          format: date
          example: "2026-06-18"
        totalMustSees:
          type: integer
          example: 5
        completedActivitiesCount:
          type: integer
          example: 2
        totalActivitiesCount:
          type: integer
          example: 8

    TripGenerationRequest:
      type: object
      required:
        - cityId
        - startDate
        - endDate
        - baseHotel
        - mustSees
      properties:
        cityId:
          type: string
          example: "madrid-es"
        startDate:
          type: string
          format: date
          example: "2026-06-15"
        endDate:
          type: string
          format: date
          example: "2026-06-18"
        defaultStartHour:
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          default: "09:00"
          example: "09:00"
        baseHotel:
          $ref: '#/components/schemas/Location'
        mustSees:
          type: array
          items:
            $ref: '#/components/schemas/MustSeeInput'

    Location:
      type: object
      required:
        - name
        - latitude
        - longitude
      properties:
        name:
          type: string
          example: "Hotel RIU Plaza España"
        latitude:
          type: number
          format: double
          example: 40.4241
        longitude:
          type: number
          format: double
          example: -3.7109

    MustSeeInput:
      type: object
      required:
        - placeId
        - priority
      properties:
        placeId:
          type: string
          example: "pl-museo-del-prado"
        priority:
          type: string
          enum: [HIGH, MEDIUM, LOW]
          example: "HIGH"
        pinnedDayIndex:
          type: integer
          minimum: 0
          example: 0
        pinnedBlock:
          type: string
          enum: [MORNING, AFTERNOON, EVENING]

    TripReplanRequest:
      type: object
      required:
        - currentDateTime
        - currentLocation
        - currentBlockWeather
      properties:
        currentDateTime:
          type: string
          format: date-time
          example: "2026-06-15T14:15:00Z"
        currentLocation:
          $ref: '#/components/schemas/Location'
        currentBlockWeather:
          type: string
          enum: [GOOD, BAD]
          example: "BAD"

    TripPlanResponse:
      type: object
      properties:
        tripId:
          type: string
          format: uuid
          example: "b5a9c123-4321-9876-fedc-ba9876543210"
        cityId:
          type: string
          example: "madrid-es"
        days:
          type: array
          items:
            $ref: '#/components/schemas/DayPlan'

    DayPlan:
      type: object
      properties:
        dayIndex:
          type: integer
          example: 0
        date:
          type: string
          format: date
          example: "2026-06-15"
        weatherSummary:
          type: string
          enum: [GOOD, BAD]
          example: "GOOD"
        blocks:
          type: object
          properties:
            morning:
              $ref: '#/components/schemas/BlockTimeline'
            afternoon:
              $ref: '#/components/schemas/BlockTimeline'
            evening:
              $ref: '#/components/schemas/BlockTimeline'

    BlockTimeline:
      type: object
      properties:
        blockTotalDurationMinutes:
          type: integer
          example: 180
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityNode'

    ActivityNode:
      type: object
      properties:
        sequenceOrder:
          type: integer
          example: 1
        placeId:
          type: string
          example: "pl-parque-del-retiro"
        name:
          type: string
          example: "Parque del Retiro"
        isCompleted:
          type: boolean
          example: false
        estimatedArrival:
          type: string
          example: "16:30"
        estimatedDeparture:
          type: string
          example: "18:30"
        durationMinutes:
          type: integer
          example: 120
        isIndoor:
          type: boolean
          example: false
        transitToNext:
          $ref: '#/components/schemas/TransitDetails'

    TransitDetails:
      type: object
      properties:
        transportMode:
          type: string
          enum: [WALK_AND_PUBLIC_TRANSPORT, CAR]
          example: "WALK_AND_PUBLIC_TRANSPORT"
        durationMinutes:
          type: integer
          example: 20
        bufferMinutes:
          type: integer
          example: 10
        frictionAlert:
          type: boolean
          example: false

    PlaceResponse:
      type: object
      properties:
        placeId:
          type: string
          example: "fsq_1"
        name:
          type: string
          example: "Museo del Prado"
        cityId:
          type: string
          example: "madrid-es"
        location:
          $ref: '#/components/schemas/PlaceLocationModel'
        typicalDurationMinutes:
          type: integer
          example: 120
        isIndoor:
          type: boolean
          example: true
        isFamilyFriendly:
          type: boolean
          example: true
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursWindowModel'

    PlaceLocationModel:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 40.4168
        longitude:
          type: number
          format: double
          example: -3.7038

    OpeningHoursWindowModel:
      type: object
      properties:
        dayOfWeek:
          type: integer
          enum: [0, 1, 2, 3, 4, 5, 6]
          description: "Day of week: 0 = Sunday, 1 = Monday, 2 = Tuesday, 3 = Wednesday, 4 = Thursday, 5 = Friday, 6 = Saturday."
          example: 1
        openMinutes:
          type: integer
          example: 540
        closeMinutes:
          type: integer
          example: 1200

    PlaceSearchRequest:
      type: object
      required:
        - query
        - cityCode
      properties:
        query:
          type: string
          minLength: 3
          example: "Museo"
        cityCode:
          type: string
          example: "madrid-es"
        maxResults:
          type: integer
          minimum: 1
          maximum: 10
          default: 10
          example: 10

    ErrorCode:
      type: string
      enum:
        - MIN_LENGTH_VIOLATION
        - INVALID_CITY
        - MAX_RESULTS_EXCEEDED
        - EXTERNAL_SERVICE_FAILURE
        - REQUIRED_FIELD
        - VALIDATION_ERROR

    ValidationResult:
      type: object
      properties:
        errorCode:
          $ref: '#/components/schemas/ErrorCode'
        description:
          type: string
          example: "The search query must be at least 3 characters long."