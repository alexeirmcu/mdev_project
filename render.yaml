services:
  - type: web
    name: smart-trip-planner-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: smart-trip-planner
      - key: Jwt__Audience
        value: smart-trip-planner-api
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: smart-trip-planner-db
          property: connectionString
      - key: FoursquareApi__ApiKey
        sync: false
      - key: LlmApi__ApiKey
        sync: false

databases:
  - name: smart-trip-planner-db
    databaseName: smart_trip_planner
    user: smart_trip
    plan: free

envVarGroups:
  - name: smart-trip-secrets
    envVars:
      - key: FoursquareApi__ApiKey
        sync: false
      - key: LlmApi__ApiKey
        sync: false